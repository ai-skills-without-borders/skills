    population: health-professions
    design: review with design guidelines
    transfer: "Fifteen design guidelines written for health-professions education; a review, not a trial."
  roediger-karpicke-2006:
    cite: "Roediger, H. L., & Karpicke, J. D. (2006). Test-enhanced learning: Taking memory tests improves long-term retention. Psychological Science, 17(3), 249–255."
    short: "Roediger & Karpicke, 2006"
