principles:
  # ---------------- Layer 1: overarching principles of science teaching ----------------
  - id: scientific-teaching
    name: Scientific teaching
    layer: science
    basis: standard
    summary: "Teach the way we do science: choose methods with evidence behind them, measure what works, and change course on the data."
    sources: [handelsman-2004:origin, freeman-2014:science-ed, harden-beme-1999:med-ed]
    applies:
      library: "Every skill states what each rule rests on; usage reports and maturity levels test the skills the way an experiment would."

  - id: constructive-alignment
    name: Constructive alignment
    layer: science
    basis: standard
    summary: "Objectives, activities and assessment are designed together, so learners practise and are tested on what the objectives say."
    sources: [biggs-1996:origin, harden-amee14-1999:med-ed, frank-2010:med-ed, harden-amee21-2001:med-ed]
    applies:
      learning-objectives-designer: "Checks each objective for an activity and an assessment and reports the gaps."
      syllabus-builder: "Links objectives, schedule and assessment; a competency counts as evidence only when it is assessed."
      exam-question-writer: "A blueprint before items; one item tests one objective."
      lesson-format-checker: "Every lesson segment names the objective it serves, and every objective is served."
      curriculum-map-builder: "Links course goals, module goals, session objectives and assessment items, and flags goals that are never taught or never assessed."

  - id: observable-objectives
    name: Observable, levelled objectives
    layer: science
    basis: standard
    summary: "One observable verb at a defined cognitive level; for skills, a condition and a criterion."
    sources: [anderson-krathwohl-2001:origin, mager-1962:origin, thomas-kern-2016:med-ed, chatterjee-corral-2017:med-ed]
    applies:
      learning-objectives-designer: "One verb, one target; no 'understand' or 'know'; level matched to what the activity demands."
      syllabus-builder: "Course objectives use the same rules."
      curriculum-map-builder: "Checks objectives per session for one clear task, varied verbs and no vague verbs such as 'understand'."
    practice_note: "Collapsing Bloom's six levels into three (Foundational / Applied / Advanced) is a local convention for easier agreement; the skill records both."

  - id: active-learning
    name: Active learning
    layer: science
    basis: research
    summary: "Learners do something with the material in class, rather than only listen. It raises exam scores and cuts failure rates."
    sources: [freeman-2014:origin, boedeker-2025:med-ed, hew-lo-2018:med-ed, fatmi-2013:med-ed, chen-2017:med-ed]
    limits: "In medical education, much of the evidence comes from studies with weak designs, and flipped classrooms in particular show mixed effects on knowledge. The randomized trial by Boedeker et al. (2025) is the strongest single result."
    applies:
      pbl-rbl-session-builder: "Every phase asks students to predict, analyse or decide before anything is revealed."
      reading-material-generator: "Readings end with questions students answer, not only text to absorb."
      journal-club-planner: "The audience takes rotating roles, and at least a third of the session goes to discussion the student leads."

  - id: productive-failure
    name: Problem solving before instruction
    layer: science
    basis: research
    summary: "Trying first, then consolidating, improves understanding and transfer, when the struggle is designed and followed by explicit instruction."
    sources: [kapur-2008:origin, schwartz-bransford-1998:origin, sinha-kapur-2021:science-ed, steenhof-2019:med-ed]
    applies:
      pbl-rbl-session-builder: "The productive trap, predict before reveal, design before seeing, and staged information release, with a consolidating reveal after each trap."
    limits: "Struggle without consolidation is just failure. Health-professions evidence is one small pharmacy trial."

  - id: cognitive-load
    name: Managing cognitive load
    layer: science
    basis: research
    summary: "Working memory is limited, and novices need guidance: one inference per prompt, terms defined at first use, worked examples before independent work."
    sources: [sweller-1988:origin, kirschner-2006:science-ed, vanmerrienboer-sweller-2010:med-ed]
    applies:
      pbl-rbl-session-builder: "One inference per prompt, observation before inference, calibration to the student stage."
      reading-material-generator: "A teaching arc in the order a newcomer needs, inline definitions, depth over coverage."
      lesson-format-checker: "Time estimates on every part; provided code at first exposure, student-written code once the pattern is known."
      learning-objectives-designer: "One target per objective."

  - id: retrieval-practice
    name: Retrieval practice with feedback
    layer: science
    basis: research
    summary: "Recalling strengthens memory more than rereading, and feedback is essential."
    sources: [roediger-karpicke-2006:origin, larsen-2008:med-ed]
    applies:
      reading-material-generator: "A click-to-reveal self-check at the end of each reading."
      pbl-rbl-session-builder: "Comprehension quizzes answerable from the reading."
      exam-question-writer: "In formative mode, a rationale for every option."

  - id: spaced-practice
    name: Spaced practice
    layer: science
    basis: research
    summary: "Spreading practice over time beats massing it, and the gap should grow with how long knowledge must last."
    sources: [cepeda-2006:origin, kerfoot-2007:med-ed]
    applies: {}

  - id: effective-feedback
    name: Effective feedback
    layer: science
    basis: research
    summary: "Specific, timely feedback about the task, with a clear next step, is among the strongest influences on learning, but its effect depends on how it is given."
    sources: [hattie-timperley-2007:origin, ramani-krackov-2012:med-ed]
    applies:
      leadership-communication-meeting-organizer: "Every speaker gets one specific strength and one specific next step, about the talk and not the person, in a safe setting."
      journal-club-planner: "The student explains each figure first, and the feedback checks and sharpens that reading."
    limits: "The large review is mostly from schools; the medical-education source is a practical guide, not a trial."

  - id: structured-mentoring
    name: Structured mentoring and development plans
    layer: science
    basis: research
    summary: "Mentoring works best when expectations are set out early, meetings are regular, progress and development plans are reviewed, and mentors are trained."
    sources: [nasem-mentorship-2019:origin, pfund-2014:med-ed, nih-idp-2014:standard]
    applies:
      mentor-compact-creator: "Mentor and trainee each write down their expectations, compare them and agree a one-page compact with a review date."
      committee-meeting-planner: "Regular committee meetings with progress, problems, a plan, and training and career goals; the committee's advice is written up and confirmed."
      thesis-lab-navigator: "Helps a student choose rotations and a thesis lab by asking about mentoring style and expectations, not only research topic."
      mdphd-calendar-builder: "Puts mentor meetings, committee meetings and yearly development plans on the program calendar."
    limits: "Strong evidence that mentor training improves mentoring skills; less direct evidence that a written compact or plan by itself improves trainee outcomes."

  # ---------------- Layer 2: principles specific to medical education ----------------
  - id: competencies-entrustment
    name: Competencies and entrustment
    layer: medicine
    basis: standard
    summary: "Count a competency only where learners perform it and someone observes it. Frameworks need faculty review before use."
    sources: [frank-2010:origin, ten-cate-2005:origin, aamc-competencies-2024:standard, estrada-2026:standard]
    applies:
      syllabus-builder: "Framework links are proposals for the course leader to approve; wording comes only from the supplied document."
      learning-objectives-designer: "Suggests competency links for each objective, for the educator to confirm."
    practice_note: "The E / P / X levels and the 're-check above six E links' rule are local methods that apply entrustment to course mapping."

  - id: clinical-context
    name: Problems and clinical context
    layer: medicine
    basis: research
    summary: "Working on problems activates prior knowledge and stores it where it will be used. Teaching basic science in a clinical context helps build illness scripts."
    sources: [schmidt-1983:origin, norman-schmidt-1992:med-ed, schmidt-rikers-2007:med-ed, colliver-2000:med-ed]
    applies:
      pbl-rbl-session-builder: "Case- or tool-driven phases, learning issues and research questions, calibrated to the student stage."
    limits: "Whole PBL curricula show modest or mixed knowledge effects (Colliver, 2000), so the skill adds the structure of the layer-1 principles."

  - id: deliberate-practice
    name: Deliberate practice and simulation
    layer: medicine
    basis: research
    summary: "Expertise grows through focused practice on specific weaknesses with immediate feedback, not through experience alone."
    sources: [ericsson-2004:origin, mcgaghie-2011:med-ed]
    applies:
      leadership-communication-meeting-organizer: "Members speak repeatedly in a low-stakes group and get immediate, specific feedback after each turn."

  - id: item-writing
    name: Item-writing quality
    layer: medicine
    basis: standard
    summary: "Validated guidelines define well-formed items. Flawed items are common and disadvantage some students."
    sources: [haladyna-2002:origin, nbme-2020:standard, downing-2005:med-ed]
    applies:
      exam-question-writer: "The flaw checklist, the cover-the-options test, homogeneous options, no 'all/none of the above', fair vignettes."

  - id: assessment-programme
    name: Assessment validity and programmes
    layer: medicine
    basis: standard
    summary: "A result supports a decision only with validity evidence for that use. Competence is judged from many assessments together, not from one."
    sources: [vandervleuten-1996:origin, downing-2003:med-ed, vandervleuten-schuwirth-2005:med-ed]
    applies:
      exam-question-writer: "Asks formative or summative first; summative items need expert review, piloting and item analysis."
      committee-meeting-planner: "Treats the thesis committee meeting as one of many checkpoints: the student brings the last meeting's action items, and the committee confirms a written summary of its advice."
      syllabus-builder: "A competency counts as evidence only where performance is observed or assessed."

  - id: professional-identity
    name: Professional identity formation
    layer: medicine
    basis: standard
    summary: "Medical education should help learners come to think, act and feel like physicians (and, for MD-PhD students, like physician-scientists), not only perform competently."
    sources: [cruess-2014:origin]
    applies: {}

  # ---------------- Layer 3: teaching in the AI era ----------------
  - id: responsible-ai
    name: Responsible AI in education
    layer: ai
    basis: standard
    summary: "Disclose AI use, protect privacy, give equal access, keep the educator in charge, and never invent sources."
    sources: [aamc-ai-2025:origin, aamc-ai-competencies-2026:standard, masters-2023:med-ed, unesco-2024:standard]
    see_also:
      - title: "AAMC: Advancing AI Across Academic Medicine resource collection"
        url: https://www.aamc.org/about-us/mission-areas/medical-education/advancing-ai-across-academic-medicine-resource-collection
    applies:
      all: "An AI-assistance line in the institution's wording; no identifiable patient or learner data; the educator approves before anything is final; no invented sources."
      library: "Open format and paste-in versions, so access does not depend on one paid tool."

  - id: ai-guardrails
    name: AI that protects learning
    layer: ai
    basis: research
    summary: "Unrestricted AI help can raise practice scores and lower real learning. Student-facing AI should guide rather than hand over answers, and its effects should be studied."
    sources: [bastani-2025:origin, tolsgaard-2023:med-ed, gordon-2024:med-ed]
    applies:
      journal-club-planner: "The student explains each figure in their own words first; the AI checks and fills gaps instead of explaining the paper for them."
    limits: "The trial was in high-school mathematics, and no health-professions study yet tests whether AI guardrails protect learning. Journal Club Planner is the first skill built this way; other learner-facing skills should follow it."
