    transfer: "A small single-school trial in pharmacy. No difference on standard recall or application; an advantage on learning new related material."
  sweller-1988:
    cite: "Sweller, J. (1988). Cognitive load during problem solving: Effects on learning. Cognitive Science, 12(2), 257–285."
    short: "Sweller, 1988"
    doi: 10.1207/s15516709cog1202_4
    population: lab
    design: experiments
    transfer: "Laboratory problem solving; the theory was later applied to health professions (see van Merriënboer & Sweller, 2010)."
  kirschner-2006:
    cite: "Kirschner, P. A., Sweller, J., & Clark, R. E. (2006). Why minimal guidance during instruction does not work. Educational Psychologist, 41(2), 75–86."
    short: "Kirschner, Sweller & Clark, 2006"
