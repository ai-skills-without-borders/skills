# Principles registry: the single source of truth for the library's pedagogy.
#
# The website's pedagogy page, the principle list in guide/pedagogy.md and the gap
# report (guide/principle-gaps.md) are all generated from this file by tools/build.py.
# Edit here, not there.
#
# Three layers of principles:
#   science  - overarching principles of science teaching, shared by biomedical
#              research, PhD and pre-clinical teaching. Most come from the learning
#              sciences or general STEM education.
#   medicine - principles specific to medical and health-professions education,
#              with no direct counterpart in general science teaching.
#   ai       - principles for teaching with AI. They apply across both layers above.
#
# Two-tier source policy:
#   - Every principle cites its origin: the source where it was first formulated.
#   - Because this library is for medical and biomedical educators, every principle
#     also needs at least one source from health-professions education (role: med-ed),
#     or a standard from a medical-education body (role: standard). A principle
#     without one is shown as "evidence from general education only", not hidden.
#   - Every source records who was studied (population), how (design), and a short
#     transfer note: how far the finding carries to our learners.
#
# Source roles: origin | science-ed | med-ed | standard
# Populations:  lab (laboratory or cognitive psychology studies), school (K-12),
#               stem-ug (undergraduate STEM), higher-ed (higher education in general),
#               health-professions (medical, pharmacy or other health-professions learners),
#               standard (a professional body's standard or framework)
# Basis labels: research | standard | practice
#
# context_only: true marks a source that gives medical-education context but is not
# evidence for the principle's claim (a methods guide, say). It does not count
# toward the medical-education tier.
#
# Only add a source you have checked against the publisher or PubMed. Leave the doi
# out rather than guess it.

sources:
  biggs-1996:
    cite: "Biggs, J. (1996). Enhancing teaching through constructive alignment. Higher Education, 32(3), 347–364."
    short: "Biggs, 1996"
    doi: 10.1007/BF00138871
    population: higher-ed
    design: theory
    transfer: "A design theory for any course; adopted widely in medical curricula, but not tested experimentally there."
  anderson-krathwohl-2001:
    cite: "Anderson, L. W., & Krathwohl, D. R. (Eds.). (2001). A taxonomy for learning, teaching, and assessing: A revision of Bloom's taxonomy of educational objectives. Longman."
    short: "Anderson & Krathwohl, 2001"
    population: higher-ed
    design: framework
    transfer: "A general classification of objectives; used as-is in medical schools."
  mager-1962:
    cite: "Mager, R. F. (1962). Preparing objectives for programmed instruction. Fearon."
    short: "Mager, 1962"
    population: higher-ed
    design: framework
    transfer: "Condition and criterion suit procedural and clinical skills especially well."
  handelsman-2004:
    cite: "Handelsman, J., Ebert-May, D., Beichner, R., et al. (2004). Scientific teaching. Science, 304(5670), 521–522."
    short: "Handelsman et al., 2004"
