    design: review
    transfer: "A general argument about novices; contested by productive-failure research."
  vanmerrienboer-sweller-2010:
    cite: "van Merriënboer, J. J. G., & Sweller, J. (2010). Cognitive load theory in health professional education: Design principles and strategies. Medical Education, 44(1), 85–93."
