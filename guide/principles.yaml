    short: "Freeman et al., 2014"
    doi: 10.1073/pnas.1319030111
    population: stem-ug
    design: meta-analysis (225 studies)
    transfer: "Undergraduate STEM courses, including biology. Closest to pre-clinical and graduate science teaching; not tested in clinical settings."
  kapur-2008:
    cite: "Kapur, M. (2008). Productive failure. Cognition and Instruction, 26(3), 379–424."
    short: "Kapur, 2008"
    population: school
    design: experiment
    transfer: "Secondary-school mathematics."
  schwartz-bransford-1998:
    cite: "Schwartz, D. L., & Bransford, J. D. (1998). A time for telling. Cognition and Instruction, 16(4), 475–522."
    short: "Schwartz & Bransford, 1998"
    population: higher-ed
    design: experiment
    transfer: "University students in psychology; the idea of preparation for future learning carries well to science courses."
  sinha-kapur-2021:
    cite: "Sinha, T., & Kapur, M. (2021). When problem solving followed by instruction works: Evidence for productive failure. Review of Educational Research, 91(5), 761–798."
    short: "Sinha & Kapur, 2021"
    doi: 10.3102/00346543211019105
