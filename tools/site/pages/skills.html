<div class="pagehead wrap">
  <h1>The skills</h1>
  <p>Search by what you need to do. Choose your AI tool to see how to install. Each skill has its own page with the evidence behind it, where it has been tested, and how to adapt it.</p>
</div>
<section id="catalog">
  <div class="wrap">
    <div class="controls">
      <div>
        <label for="q">What do you need to do?</label>
        <input id="q" type="search" placeholder="e.g. write exam questions, map my course, pre-reading" autocomplete="off">
      </div>
      <div>
        <label id="tool-label">Your AI tool</label>
        <div class="seg" role="group" aria-labelledby="tool-label" id="tools"></div>
      </div>
    </div>
    <div class="install" id="install" aria-live="polite"></div>
    <div class="list" id="list"></div>
  </div>
</section>
