<div class="pagehead wrap">
  <h1>The skills</h1>
  <p>Search by what you need to do. Each skill has its own page with the evidence behind it, where it has been tested, and how to adapt it. <a href="#install">How to install a skill</a> is at the end of this page.</p>
</div>
<section id="catalog">
  <div class="wrap">
    <div class="controls">
      <div>
        <label for="q">What do you need to do?</label>
        <input id="q" type="search" placeholder="e.g. write exam questions, map my course, pre-reading" autocomplete="off">
      </div>
      <div>
        <label id="users-label">Used by</label>
        <div class="seg" role="group" aria-labelledby="users-label" id="users">
          <button type="button" data-u="" aria-pressed="true">Everyone</button>
          <button type="button" data-u="educators" aria-pressed="false">Educators</button>
          <button type="button" data-u="learners" aria-pressed="false">Learners</button>
          <button type="button" data-u="program-staff" aria-pressed="false">Program staff</button>
        </div>
      </div>
    </div>
    <p class="closest" id="closest" hidden>No skill matches every word; these are the closest.</p>
    <div class="list" id="list">{{STATIC_LIST}}</div>
  </div>
</section>
<section id="install">
  <div class="wrap">
    <h2>Install a skill</h2>
    {{INSTALL}}
  </div>
</section>
