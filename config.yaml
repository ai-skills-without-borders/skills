# Library settings used by tools/build.py. Change repo once the GitHub organization exists.
library_name: AI Skills Without Borders
tagline: Shared AI skills for medical and biomedical-research educators
# Who may publish a new skill automatically (as Draft), without a maintainer's approval:
# the users listed here, plus anyone with an accepted contribution recorded under their
# GitHub username in community/contributors.yaml. First-time contributors need one approval.
auto_publish: [mmmmpf, taliaswartz]
# GitHub users whose submissions always need approval, even after earlier contributions
no_auto_publish: []
repo: ai-skills-without-borders/skills        # <github-org>/<repo>
site_url: https://ai-skills-without-borders.github.io/skills/
plugin_name: ai-skills-without-borders
version: 0.1.18
contact: "Amit Shraga (Weizmann Institute of Science) and Talia H. Swartz (Icahn School of Medicine at Mount Sinai)"
founders:
  - name: "Amit Shraga, PhD"
    role: "Head of Data Science Tools; Chair, AI & Digital Tools Committee"
    institution: "The Miriam and Aaron Gutwirth Medical School, Weizmann Institute of Science"
    github: mmmmpf
  - name: "Talia H. Swartz, MD, PhD"
    role: "Senior Associate Dean for MD-PhD Education; Professor of Medicine (Infectious Diseases); Director, MD-PhD Program"
    institution: "Icahn School of Medicine at Mount Sinai"
    github: taliaswartz
