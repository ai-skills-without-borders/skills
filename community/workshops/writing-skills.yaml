# Workshop 2: Writing AI skills (advanced).
# Single source for the workshop page, the slide deck and the PowerPoint download.
# Inline formatting: **bold**, [text](link), `code`. Links may use {ROOT} (site root) and {GH} (GitHub repo).
id: writing-skills
order: 2
level: Advanced
title: Writing AI skills
tagline: Participants turn a teaching task they know well into a skill, test it, have a colleague try it, and share it in the library.
minutes: 120
audience: Educators who have used at least one AI skill, in the first workshop or on their own. No programming needed; writing a skill means writing clear instructions in plain English.
group: 6 to 24 participants, working alone or in pairs. One helper for every 8 participants.
outcome: Every participant leaves with a tested draft skill for a task from their own work, a peer test of it, and the skill submitted to the shared library with their institution credited.
facilitator: Anyone who has written at least one skill and submitted it to the library. The plan, the script, the prompts and the slides are all here.

objectives:
  - Choose a teaching task that is worth turning into a skill.
  - Write a skill's description so that an AI assistant knows when to use it.
  - Write instructions with ordered steps, checkpoints for the educator's approval, and an exact output.
  - Test the skill on real material and improve it from what went wrong.
  - Run a peer test and record what a colleague needed to use the skill.
  - Submit the skill to the shared library through the GitHub form.

bring:
  - A laptop and its charger.
  - An AI assistant account, signed in. Any tool works; testing uses the paste-in method, which works everywhere.
  - "A free GitHub account, created before the session (the steps are below). It takes 5 minutes and needs only an email address."
  - "Two non-confidential documents for the task you choose: one example of the task done well (your own earlier work), and one fresh input to test the skill on. No patient data and no identifiable learner data."

prework:
  title: Before the session (20 minutes, at home)
  intro: Send these steps to participants a week before. The GitHub account matters most; creating it in the session costs everyone time.
  steps:
    - title: Create a free GitHub account
      text: "GitHub is the website where the library lives. You need an account only to submit your skill through a web form; you will not install anything or write any code. Go to [github.com/signup](https://github.com/signup), or open [github.com](https://github.com) and click **Sign up**. You can also click **Continue with Google**."
    - title: Enter your email, a password and a username
      text: "Use your academic email so colleagues recognize you. Your username appears publicly next to your submissions; your name and institution are easy choices (for example `dana-levi-weizmann`). Untick the product-updates box if you prefer."
    - title: Pass the verification puzzle
      text: "GitHub shows a short puzzle to check that you are a person. If it doesn't appear, switch off your ad blocker for the page and reload."
    - title: Enter the code from your email
      text: GitHub sends a code to your email address. If it doesn't arrive in a few minutes, check your spam folder. Without a verified email you cannot submit.
    - title: Skip the personalization questions
      text: "GitHub asks what you plan to use it for. You can skip these; the free plan is all you need. Write down your username and password."
    - title: Choose your task
      text: "Think of one teaching task you do often and do well, where you know what good looks like: writing objectives for a session, giving feedback on a draft, preparing a journal club, planning a committee meeting. Read the task criteria on this page and bring the two documents."

prep:
  - when: Three weeks before
    items:
      - Book a room with power for every seat, a projector and reliable Wi-Fi. Check that the Wi-Fi does not block GitHub or the AI tools.
      - "Recruit helpers, one for every 8 participants, who have written and submitted a skill themselves."
      - "Tell the library's maintainers the date and the expected number of submissions (see Contact on the About page). First-time submissions are reviewed by a maintainer before they go live, so they can plan to review them in the following days."
  - when: One week before
    items:
      - "Send the invitation with the pre-work, stressing the GitHub account (the email template is below)."
      - "Choose a published skill to take apart in the session. A short, clear one works best, for example [Learning Objectives Designer]({ROOT}skills/learning-objectives-designer.html). Open its SKILL.md on GitHub and read it through."
  - when: The day before
    items:
      - "Write a small skill yourself, start to finish, using the drafting prompt below, and test it with the paste-in method. You will show it as the worked example."
      - "Open the [new-skill form]({GH}/issues/new?template=new-skill.yml) while signed in, and check the fields against the guide on this page. Don't submit; close the tab."
      - "Print, one per participant: the skill template, the writing checklist, the peer-test sheet and the submission guide (all on this page). Or share this page's link instead."
  - when: On the day, 30 minutes before
    items:
      - "Put the Wi-Fi details, this page's address and the drafting prompt on the board or in a shared document, so participants can copy the prompt."
      - "Ask participants as they arrive whether they created their GitHub account. Send those who didn't to a helper to do it straight away, before the session starts."

agenda:
  - minutes: 10
    title: Welcome and goals
    note: What we will build, and a skill a colleague already shared
    slides: [1, 3]
    facilitator:
      - Welcome everyone, introduce the helpers, and show the plan.
      - "Show a skill that a colleague contributed to the library, and its page: the author and institution credited, the maturity level, the usage reports."
      - Ask each participant to say their task in one sentence.
    participants:
      - Say their task in one sentence to the group or the table.
    say: "By the end of these two hours, your teaching expertise will be in a form that any colleague, anywhere, can use in their own AI assistant. Not a prompt you retype every time: a skill, tested, and shared with your name and your institution on it."
    check: Everyone has a task in one sentence, and a GitHub account (or a helper creating one with them).
  - minutes: 15
    title: Anatomy of a skill
    note: Take a published skill apart, and the six-part template
    slides: [4, 8]
    facilitator:
      - "Open the chosen skill's SKILL.md on GitHub (slide 5). Show the parts: the name and description at the top, the steps, the checkpoints, the output, and the limits."
      - "Explain the description (slide 6): it is how the assistant decides to use the skill, so it says what the skill does and when, in the words a user would type."
      - "Introduce the six-part template (slide 7) that every skill in the library follows, and the common mistakes (slide 8)."
    participants:
      - Follow along on their own screen, in the same SKILL.md.
    say: "A skill is mostly plain English. The top two lines, name and description, decide whether the assistant ever uses it. The rest reads like a protocol a careful colleague would write for a new team member: what to ask for, what to do in which order, where to stop and check with you, and what the result must look like."
    check: "Ask: where does the assistant look to decide whether to use a skill? (The description.)"
  - minutes: 10
    title: Choose your task and write its description
    note: The task criteria, then purpose and description
    slides: [9, 10]
    facilitator:
      - Go through the criteria for a good first task (slide 9).
      - Ask participants to write the purpose and the description, then read the description to a neighbour.
    participants:
      - "Write the purpose (one or two sentences) and the description (what it does, when to use it, typical requests)."
      - "Read the description to a neighbour, who says whether they would know when to use it."
    say: "Keep the first skill small: one task, not a whole job. 'Write learning objectives for one session' is a skill. 'Design my course' is ten skills."
    check: Every participant has a purpose and a description that a neighbour understood.
  - minutes: 30
    title: Write the skill
    note: Fill the template, draft the instructions, alone or with AI as interviewer
    slides: [11, 13]
    facilitator:
      - "Explain the two ways to draft (slide 12): write it yourself in a document, or let the AI interview you with the drafting prompt."
      - Show your own worked example briefly.
      - "Circulate. At 20 minutes, remind everyone that a complete rough draft beats a perfect half: they need every part in place to test it."
    participants:
      - "Fill in the six parts of the template, then write the instructions: steps in order, checkpoints, the output, the limits."
    say: "Write down what you actually do, in the order you do it, including the things you check without thinking: those are the expertise. Wherever you would say 'it depends', write a question the skill should ask the educator."
    check: Every participant has a complete draft, all six parts and the instructions, by the end of the block.
  - minutes: 15
    title: Test and improve
    note: Paste-in test on fresh material, fix the instruction, test again
    slides: [14, 15]
    facilitator:
      - "Explain the test loop (slide 14): new chat, paste the skill, give it the fresh input, compare against the success criteria."
      - "Stress the rule: when the output is wrong, fix the instruction that caused it, not the output."
    participants:
      - Test the skill on the fresh input, fix what went wrong, and run it a second time.
    say: "Testing is where most of the improvement happens. Each thing that goes wrong points at an instruction that was missing or unclear. Fix that line, start a new chat, and run it again."
    check: Each skill has run at least twice, with at least one instruction improved.
  - minutes: 15
    title: Peer test
    note: A colleague uses your skill without your help
    slides: [16, 17]
    facilitator:
      - "Explain the peer test (slide 17): swap skills; the colleague uses it on their own material or on your test input; the author watches silently and takes notes."
      - Hand out the peer-test sheet.
    participants:
      - Swap skills, use the colleague's skill, and fill in the peer-test sheet for it.
    say: "Authors: this is the hard part. Don't help. Every time you want to explain something, write it down instead. That's a line missing from your skill."
    check: Every skill has a completed peer-test sheet.
  - minutes: 20
    title: Share it in the library
    note: The new-skill form on GitHub, field by field
    slides: [18, 19]
    facilitator:
      - "Show the new-skill form on the projector, field by field, using your worked example (slide 18). Don't submit the example."
      - Then let participants submit. Helpers circulate.
      - "Explain what happens next (slide 19)."
    participants:
      - "Sign in to GitHub, open the form, copy their parts and instructions into it, tick the rights box, and submit."
    say: "Each field in the form is one of the six parts you've already written, so this is mostly copy and paste. Paste your instructions in the Instructions field. Tick the credit box if you want your name on the skill; your institution is recorded either way."
    check: Every participant who is ready has submitted. The others know how to submit later.
  - minutes: 5
    title: Closing
    note: What happens next, and how the skill grows
    slides: [20, 20]
    facilitator:
      - "Go around: one thing each participant learned about their own expertise by writing it down."
      - "Close with the next steps: watch for the reply on their submission, ask colleagues to send usage reports, and review someone else's skill."
    participants:
      - Say one thing they learned.
    say: Your skill starts as a Draft. Every colleague who uses it and reports back moves it up. Thank you for sharing what you know.
    check: Everyone knows where to find their submission.

guides:
  - id: criteria
    title: Is this task a good first skill?
    checklist:
      - "**You do it often**, so a skill saves you and others real time."
      - "**You do it well** and know what a good result looks like."
      - "**It is one task**, with a clear start and a clear result, not a whole job."
      - "**Other educators do it too**, at other institutions."
      - "**It needs no confidential data**: no patient data and no identifiable learner data."
  - id: template
    title: The six-part template
    intro: Every skill in the library is described in the same six parts. They are also the fields of the submission form.
    steps:
      - title: Purpose
        text: What task the skill does, and when an educator should use it. One or two sentences.
      - title: Inputs
        text: What the user must provide (a syllabus, a paper, a list of objectives), and what the skill should ask for if it is missing.
      - title: Instructions
        text: The steps the AI follows, in order, the standards it applies, and the points where it stops for the educator's approval.
      - title: Expected output
        text: "The exact shape of the result: its sections, format and length."
      - title: Success criteria
        text: How you will know the output is good enough to use.
      - title: Limitations
        text: What the skill does not do, where it may fail, and what the educator must always check.
  - id: anatomy
    title: What a SKILL.md looks like
    intro: "A skill is a text file named SKILL.md. The two lines between the dashes at the top are read first; the rest is read when the skill is used. You don't have to build this file: the submission form builds it from what you paste. It helps to see it."
    code: |
      ---
      name: journal-club-feedback
      description: Gives structured feedback on a trainee's journal club presentation plan. Use when an educator asks to review, check or improve a journal club plan or slides.
      ---

      # Journal Club Feedback

      ## Step 1: Gather what you need
      Ask for the paper and the trainee's plan if they are missing.
      Ask the trainee's stage (first year, senior) if it isn't stated.

      ## Step 2: Check the plan against the standards
      ...

      ## Step 3: Stop for approval
      Show the three main points of feedback. Wait for the educator to approve or edit them.

      ## Output
      A one-page feedback note: strengths, three changes in priority order, one question for the trainee.

      ## Limitations
      Does not judge the science of the paper. Never invents references.
  - id: prompt
    title: The drafting prompt
    intro: Copy this into a new chat in your AI assistant, fill in your task, and answer its questions one at a time. Read the draft it writes carefully; it is your expertise, so correct anything it got wrong.
    code: |
      I am an educator. I want to turn one teaching task that I do well into an AI skill that colleagues at other institutions can use in their own AI assistant.

      The task: [describe it in one sentence]

      Interview me one question at a time. Find out: when the task is needed; what material I start from; the steps I follow, in order; the standards I apply and the common mistakes; where a human must check or approve before going on; the exact shape of the result; how I judge whether it is good; and what the skill must not do.

      When you have enough, write the skill as a SKILL.md file: a header with a name (lowercase words joined by hyphens) and a description that says what the skill does and when to use it, in words a user would type. Then numbered steps with the checkpoints, the output format, the success criteria and the limitations.

      Do not invent standards, rules or references. Where you are unsure, ask me. Keep it in plain English and under two pages.
  - id: checklist
    title: Writing checklist
    checklist:
      - "**The description says what and when**, in words a user would type."
      - "**One task.** If it has two results, it is probably two skills."
      - "**Steps in order**, one action each, numbered."
      - "**Asks instead of guessing** when input is missing."
      - "**Stops for approval** wherever judgement matters."
      - "**The output is exact**: sections, format, length."
      - "**Standards are named**, with their source. It never invents references."
      - "**Limits are stated**, including the data rule: no patient data, no identifiable learner data."
      - "**Plain language.** Explain local terms, so the skill works at another institution."
  - id: test
    title: The test loop
    steps:
      - title: Start a new chat
        text: A clean chat, so nothing from your drafting conversation leaks in.
      - title: Paste the whole skill as your first message
        text: "Then, below it: \"Follow the skill above for my request.\" This paste-in test works in every AI tool."
      - title: Give it the fresh input
        text: Your second document, not the example the skill was written from, and ask in the words a colleague would use.
      - title: Judge against your success criteria
        text: Did it ask for what it needed? Stop where it should? Produce the exact output? Invent anything?
      - title: Fix the instruction, not the output
        text: For each problem, change or add the line in the skill that would have prevented it. Then start again from step 1.
  - id: peer
    title: Peer-test sheet
    intro: Filled in by the colleague who tests the skill. The author watches without helping.
    checklist:
      - "Skill tested, and its author:"
      - "Could you use it without the author's help? yes / with help / no"
      - "Where did you hesitate, or what did you need to ask?"
      - "Did the skill ask for what it needed? yes / partly / no"
      - "Was the output usable? as it was / after edits / no"
      - "Did anything look invented or wrong?"
      - "One change that would make it easier for the next educator:"
  - id: submit
    title: Submit your skill, field by field
    intro: "Sign in to GitHub, then open the [new-skill form]({GH}/issues/new?template=new-skill.yml). It is also linked from the [Contribute page]({ROOT}contribute.html). Each field matches a part you have already written."
    steps:
      - title: About you
        text: "**Your name** and **role** (optional), **Institution** and **Country** (required). Tick **Credit me by name** if you want your name on the skill's page and the community page; your institution is recorded either way."
      - title: Name and purpose
        text: "**Proposed name**: a few words, for example `journal-club-feedback`. **Purpose**: what the skill does and when to use it."
      - title: Who uses it, and how they ask
        text: "Tick who uses the skill (educators, learners, program staff). Under **Tasks**, write a few requests someone might type, one per line."
      - title: The six parts
        text: "Copy in **Inputs**, **Expected output**, **Success criteria** and **Limitations** from your template."
      - title: Instructions
        text: "Paste your whole SKILL.md, or your instructions, into **Instructions**. If it is very long, save it as a text file or a ZIP and drag it into the field."
      - title: Testing and rights
        text: "Say whether you have used it for real teaching, and in which AI tools. Tick the **Rights** box: you confirm that you may share it and that it contains no confidential data."
      - title: Submit
        text: "Click **Create** (or **Submit new issue**). Your submission opens as a page on GitHub. Keep its address."
  - id: next
    title: What happens after you submit
    steps:
      - title: A robot builds and checks it
        text: Within a few minutes, the library's automation turns your form into a skill and checks that it is complete. If something is missing, it says so in a comment on your submission; edit the submission to fix it.
      - title: A maintainer reviews your first skill
        text: The first skill from a new contributor is reviewed by a maintainer before it goes live. You get a comment, and an email from GitHub, when it is published or if anything needs a change. After your first accepted skill, later ones publish automatically.
      - title: It appears as a Draft
        text: "Your skill gets its own page in the catalog, with your institution (and your name, if you ticked the box) credited. Draft means only its author has tested it."
      - title: It grows with use
        text: "Ask colleagues to use it and send a usage report. Each report from another institution moves it up, towards Tested elsewhere and Reviewed."

troubleshooting:
  - problem: The assistant ignores one of my steps.
    fix: "Number the steps and make each one a single action. Move the ignored step earlier, or state it as a rule (\"Always…\", \"Never…\")."
  - problem: The output is generic.
    fix: Add the standards you apply and a short example of a good result. Generic output usually means the expertise is still in your head, not in the skill.
  - problem: It invents references or facts.
    fix: "Add a rule: \"Never invent sources. Where something can't be verified from the material, mark it [check] and tell the educator.\""
  - problem: My colleague couldn't use it.
    fix: That is a useful result. Look at what they asked you; usually the inputs or the description were unclear. Fix those lines.
  - problem: I can't sign in to GitHub, or the form doesn't open.
    fix: "Check the code in your email (and spam folder) to verify the account. If it still fails, email your skill and the six parts to the founders (Contact, on the About page) and they will submit it with you as the author."
  - problem: The form says my text is too long.
    fix: Save the instructions as a text file or a ZIP and drag it into the Instructions field instead of pasting.

after:
  - "Watch the submissions from your session on GitHub, and help participants answer any comments."
  - "A week later, remind participants to ask one colleague each to use their skill and send a [usage report]({GH}/issues/new?template=usage-report.yml)."
  - "For a conference or a shorter slot, the 75-minute [round-table version]({GH}/blob/main/community/roundtable-protocol.md) builds skills by area of work at five tables."

invite:
  subject: "Workshop: write an AI skill from your own teaching expertise"
  body: |
    Dear colleagues,

    You are invited to a two-hour workshop on writing AI skills, on [date] at [time] in [room].

    An AI skill is teaching expertise written down so that any AI assistant can follow it. In the workshop you will turn a task you do well, for example writing objectives, giving feedback or preparing a journal club, into a skill, test it, have a colleague try it, and share it in a free international library with your institution credited. No programming is needed. It helps if you have used an AI skill before.

    Please bring:
    - a laptop and charger,
    - an account with an AI assistant, signed in on that laptop,
    - a free GitHub account (5 minutes to create; the steps are at the link below),
    - two non-confidential documents for your task: an example of it done well, and a fresh input to test on. No patient data and no student information.

    Preparation steps (20 minutes): [link to this page]

    Looking forward to seeing you,
    [name]

slides:
  - kind: title
    title: Writing AI skills
    text: From your teaching expertise to a shared skill
    notes: Welcome everyone. Introduce the helpers. Check that everyone created a GitHub account; send anyone who didn't to a helper now.
  - kind: agenda
    title: Today, in two hours
    notes: Walk through the plan. Half the time is writing and testing.
  - kind: steps
    title: How the library grows
    points:
      - "**An educator writes** a skill from what they know"
      - "**Colleagues use it** at other institutions"
      - "**They report back**, and it improves"
      - "**It moves up**, from Draft to Reviewed"
    notes: Show a skill that a colleague contributed, and its page, with the credit and the maturity level. Then ask each participant to say their task in one sentence.
  - kind: section
    title: Anatomy of a skill
    text: Part 1
    notes: We take a published skill apart.
  - kind: anatomy
    title: A skill is a text file
    points:
      - "**Name and description**: read first, to decide when to use it"
      - "**Steps**, in order"
      - "**Checkpoints** where the educator approves"
      - "**The output**, exactly"
      - "**Limitations**, and what to always check"
    notes: Open the chosen skill's SKILL.md on GitHub and scroll through it with the room, pointing at each part.
  - kind: compare
    title: The description decides whether it is ever used
    left:
      title: Too vague
      points:
        - "\"Helps with teaching.\""
        - "\"A useful tool for objectives.\""
    right:
      title: What, when, in the user's words
      points:
        - "\"Writes and fixes learning objectives for a course or session.\""
        - "\"Use when an educator asks to write, check or map objectives.\""
    notes: The assistant compares the user's request with every description. Say what the skill does, when to use it, and the words people actually use.
  - kind: grid
    title: Six parts, for every skill
    cards:
      - title: Purpose
        text: What it does, and when to use it
      - title: Inputs
        text: What the user provides, and what to ask for
      - title: Instructions
        text: Steps, standards, checkpoints
      - title: Expected output
        text: Sections, format, length
      - title: Success criteria
        text: How you know it's good enough
      - title: Limitations
        text: What it doesn't do, what to check
    notes: Every skill in the library follows these six parts. They are also the fields of the submission form, so writing them now saves time at the end.
  - kind: compare
    title: Common mistakes
    left:
      title: Avoid
      points:
        - A whole job in one skill
        - Guessing when input is missing
        - "\"Make it good\" instead of a standard"
        - No point where the educator approves
    right:
      title: Instead
      points:
        - One task, one clear result
        - Ask for what's missing
        - Name the standard and its source
        - Stop for approval where judgement matters
    notes: These four cover most of the problems we see in first drafts.
  - kind: checklist
    title: A good first task
    points:
      - "**You do it often**, so it saves real time"
      - "**You do it well**, and know what good looks like"
      - "**One task**, with a clear result"
      - "**Others do it too**, at other institutions"
      - "**No confidential data** needed"
    notes: Keep the first skill small. "Write learning objectives for one session" is a skill. "Design my course" is ten skills.
  - kind: exercise
    title: Your task and its description
    minutes: 10
    points:
      - Write the purpose in one or two sentences
      - "Write the description: what, when, in users' words"
      - Read it to a neighbour
      - Would they know when to use it?
    notes: Circulate and read descriptions. The most common problem is a description that says what but not when.
  - kind: section
    title: Write and test
    text: Part 2
    notes: The main block. Thirty minutes writing, fifteen testing.
  - kind: compare
    title: Two ways to draft
    left:
      title: Write it yourself
      points:
        - Fill in the six parts
        - Write what you do, in order
        - Turn every "it depends" into a question
    right:
      title: Let AI interview you
      points:
        - Paste the drafting prompt
        - Answer one question at a time
        - Correct the draft it writes
    notes: Both work. The interview is faster for most people, but read the draft carefully; it's your expertise, and the AI will fill gaps with plausible guesses if you let it. The prompt is on the workshop page.
  - kind: exercise
    title: Write your skill
    minutes: 30
    points:
      - Fill in the six parts
      - Write the instructions, with checkpoints
      - A complete rough draft beats a perfect half
      - Check it against the writing checklist
    notes: Show your worked example briefly, then circulate. At 20 minutes, remind everyone to get every part in place.
  - kind: steps
    title: The test loop
    points:
      - "**New chat**, nothing carried over"
      - "**Paste the skill**, then \"follow the skill above\""
      - "**Fresh input**, not the example you wrote from"
      - "**Judge** against your success criteria"
      - "**Fix the instruction**, not the output, and repeat"
    notes: The paste-in test works in every tool, so everyone tests the same way.
  - kind: exercise
    title: Test and improve
    minutes: 15
    points:
      - Run the skill on your fresh input
      - Note what went wrong
      - Fix the lines that caused it
      - Run it again in a new chat
    notes: Each skill should run at least twice, with at least one instruction improved.
  - kind: section
    title: Peer test and share
    text: Part 3
    notes: Can a colleague use your skill without you? Then into the library.
  - kind: exercise
    title: Peer test
    minutes: 15
    points:
      - Swap skills with a colleague
      - They use it on their material or your test input
      - "Authors: watch, don't help, take notes"
      - The tester fills in the peer-test sheet
    notes: Every time an author wants to explain something, that's a line missing from the skill.
  - kind: steps
    title: Submit it in the library
    points:
      - "**Sign in** to GitHub, open the new-skill form"
      - "**About you**: institution and country, credit if you want it"
      - "**The six parts**, copied from your template"
      - "**Instructions**: paste your SKILL.md"
      - "**Tick the rights box**, and submit"
    link: "{GH}/issues/new?template=new-skill.yml"
    notes: Show the form on the projector, field by field, with your worked example, without submitting. Then everyone submits.
  - kind: steps
    title: What happens next
    points:
      - "**A robot** builds and checks it, in minutes"
      - "**A maintainer reviews** your first skill"
      - "**It appears as a Draft**, with your institution credited"
      - "**Usage reports** move it up"
