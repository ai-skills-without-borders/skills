# Community registry: every institution that contributes, and every contribution.
#
# The community page (map, countries, institutions, recent contributions) is
# generated from this file by tools/build.py. A maintainer adds an entry when a
# contribution is merged or a report is received.
#
# Only contributions to skills are recorded (a new skill, an improvement, a variant,
# a usage report or a review), not other work on the project. Every contribution names an institution. A person's name appears only if they
# agreed to be credited (the "credit me by name" box in the forms).
#
# institutions:
#   <id>:                       short id, lowercase, used below and in variants/<id>/
#     name:                     full name, as the institution writes it
#     country: IL               ISO 3166-1 alpha-2 code
#     city:                     optional
#     lat, lon:                 approximate location, for the map
#     founding: true            optional, for founding institutions
#
# contributions (newest last):
#   - date: YYYY-MM-DD
#     type: skill | improvement | variant | usage-report | review
#     institution: <id>
#     skill: <skill name>       required: only contributions to skills are recorded
#     person: "Name"            only with consent
#     link: URL                 the pull request, issue or report
#     note: short description

institutions:
  weizmann:
    name: The Miriam and Aaron Gutwirth Medical School, Weizmann Institute of Science
    country: IL
    city: Rehovot
    lat: 31.90
    lon: 34.81
