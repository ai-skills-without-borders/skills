# Skill card — see GOVERNANCE.md for field meanings and maturity levels
name: syllabus-builder
title: Syllabus Builder
version: 0.1.0
summary: Builds or updates a syllabus from partial course material, with an evidence-based (E/P/X) map to any competency framework.
tasks:
- Build a syllabus
- Update a syllabus
- Map a course to competencies or EPAs
- Find coverage gaps
users: [educators]
audience:
- Course leaders
- Program directors
inputs:
- Course material
- Competency framework document
- 'Optional: institution syllabus template'
outputs:
- Syllabus (Word or Markdown)
- Course-leader report
- Companion data file for updates
runs_code: false
maturity: tested-at-origin
tested_in:
  claude: works
  chatgpt: works
  gemini: works
  copilot: untested
last_tested: "2026-09"
used_at: [weizmann]
frameworks:
- Institutional EPAs
- AAMC Foundational Competencies
- AAMC GREAT MD-PhD competencies
- AAMC AI competencies
origin_institution: The Miriam and Aaron Gutwirth Medical School, Weizmann Institute of Science
derived_from: 'Weizmann syllabus builder (generalized: framework and template are now pluggable)'
maintainers:
- Amit Shraga, PhD (Weizmann Institute of Science)
reviewers: []
license: CC-BY-4.0
starter: false
