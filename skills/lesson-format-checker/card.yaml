name: lesson-format-checker
title: Lesson & Notebook Format Checker
version: 0.1.0
summary: Checks lesson plans and Jupyter assignment notebooks against a house-style profile and applies only approved fixes.
tasks:
- Check a lesson plan's format
- Lint an assignment notebook
- Check session timing
- Create a lesson in the standard structure
users: [educators]
audience:
- Course coordinators
- Computational course teams
inputs:
- Lesson plan or .ipynb
- Format profile (two examples included)
outputs:
- Findings list
- Fixed copy with approved changes
runs_code: true
