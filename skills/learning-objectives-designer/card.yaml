# Skill card — see GOVERNANCE.md for field meanings and maturity levels
name: learning-objectives-designer
title: Learning Objectives Designer
version: 0.1.0
summary: Extracts, writes, splits, levels and maps learning objectives; produces the numbered objectives table the other skills use.
tasks:
- Write learning objectives
- Fix vague or compound objectives
- Map a course to competencies
- Check alignment of objectives, activities and assessment
users: [educators]
audience:
- Course leaders
- Session designers
- Curriculum committees
inputs:
- Course material (slides, syllabi, notebooks) or a description
- 'Optional: competency framework document'
outputs:
- Objectives table (Markdown + CSV)
- Alignment gaps
- Proposed framework links
runs_code: false
maturity: tested-at-origin
tested_in:
  claude: works
  chatgpt: works
  gemini: works
  copilot: untested
last_tested: null
used_at: [weizmann]
frameworks:
- Bloom (revised)
- Three-level scale
- Any supplied competency framework
origin_institution: The Miriam and Aaron Gutwirth Medical School, Weizmann Institute of Science
derived_from: New skill, building on the objectives rules in the Weizmann syllabus builder
maintainers:
- Amit Shraga, PhD (Weizmann Institute of Science)
reviewers: []
license: CC-BY-4.0
starter: true
