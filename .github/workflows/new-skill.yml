name: Publish new skill from issue
# When a "New skill" issue is opened or edited:
# - from a user listed under auto_publish in config.yaml, the skill is added to the
#   library as Draft, checked, committed and published, and the issue is closed;
# - from anyone else, the issue gets a thank-you comment and waits for a maintainer.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: new-skill
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'new-skill') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml markdown

      - name: Is the author trusted?
        id: trust
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, yaml
          trusted = [u.lower() for u in yaml.safe_load(open("config.yaml")).get("auto_publish", [])]
          print("trusted=" + ("yes" if os.environ["AUTHOR"].lower() in trusted else "no"))
          PY

      - name: Thank other contributors
        if: steps.trust.outputs.trusted != 'yes' && github.event.action == 'opened'
        run: |
          gh issue comment "$ISSUE" --body "Thank you for sharing a skill! A maintainer will review it and add it to the library, usually within a few days. You'll get a link here when it's published."

      - name: Fetch the issue and any attached ZIP
        if: steps.trust.outputs.trusted == 'yes'
        run: |
          mkdir -p /tmp/sub
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" --jq .body > /tmp/sub/body.md
          url=$(grep -oE 'https://github\.com/(user-attachments/files|[^ )]+/files)/[^ )]+\.zip' /tmp/sub/body.md | head -1 || true)
          if [ -n "$url" ]; then curl -sSL -H "Authorization: Bearer $GH_TOKEN" -o /tmp/sub/skill.zip "$url"; fi

      - name: Build the skill
        if: steps.trust.outputs.trusted == 'yes'
        id: build
        run: |
          zarg=""; [ -f /tmp/sub/skill.zip ] && zarg="--zip /tmp/sub/skill.zip"
          name=$(python -I tools/issue_to_skill.py /tmp/sub/body.md --issue "$ISSUE" --date "$(date -u +%F)" $zarg 2>/tmp/sub/err.txt | tail -1) || true
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ -z "$name" ]; then echo "ok=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if python tools/build.py --check > /tmp/sub/check.txt 2>&1; then
            python tools/build.py
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.build.outputs.ok == 'yes'
        run: |
          name='${{ steps.build.outputs.name }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add skill ${name} (Draft) from issue #${ISSUE}"
          git push
          gh workflow run build.yml --ref main
          site=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['site_url'])")
          gh issue comment "$ISSUE" --body "Published as **Draft**: ${site}skills/${name}.html (the site updates within a few minutes). It now moves up as people use it and send usage reports. Thank you!"
          gh issue close "$ISSUE"

      - name: Report a problem
        if: steps.trust.outputs.trusted == 'yes' && steps.build.outputs.ok != 'yes'
        run: |
          {
            echo "The skill could not be published automatically. Please fix the form (edit this issue) and it will be retried."
            echo
            echo '```'
            cat /tmp/sub/err.txt /tmp/sub/check.txt 2>/dev/null | grep -v '^warning' | tail -20
            echo '```'
          } > /tmp/sub/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/sub/comment.md
