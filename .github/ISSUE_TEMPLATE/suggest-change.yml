name: Suggest a change to a skill
description: Propose an improvement in plain words — no GitHub editing needed
title: '[change] <skill> — <short description>'
labels:
- improvement
body:
- type: input
  id: contributor_name
  attributes:
    label: Your name
- type: input
  id: institution
  attributes:
    label: Institution
    description: Every contribution is recorded with its institution, so the community page can show where the library's knowledge comes from.
  validations:
    required: true
- type: input
  id: country
  attributes:
    label: Country
  validations:
    required: true
- type: input
  id: role
  attributes:
    label: Your role
    placeholder: e.g. course leader, MSTP director, graduate program administrator
- type: checkboxes
  id: credit
  attributes:
    label: Credit
    options:
    - label: Credit me by name on the community page (otherwise only the institution is shown)
- type: dropdown
  id: skill
  attributes:
    label: Skill
    options:
    - Clinical Integration Task Generator (clinical-integration-notebooks)
    - Committee Meeting Planner (committee-meeting-planner)
    - Curriculum Map Builder (curriculum-map-builder)
    - Exam Question Writer (exam-question-writer)
    - Journal Club Planner (journal-club-planner)
    - Leadership Communication Meeting Organizer (leadership-communication-meeting-organizer)
    - Learning Objectives Designer (learning-objectives-designer)
    - Lesson & Notebook Format Checker (lesson-format-checker)
    - MD-PhD Calendar Builder (mdphd-calendar-builder)
    - MSTP T32 Preparer (mstp-t32-planner)
    - Mentor Compact Creator (mentor-compact-creator)
    - PBL / RBL Session Builder (pbl-rbl-session-builder)
    - Reading Material Generator (reading-material-generator)
    - Syllabus Builder (syllabus-builder)
    - Thesis Lab Navigator (thesis-lab-navigator)
    - Another skill, or not sure
  validations:
    required: true
- type: dropdown
  id: scope
  attributes:
    label: Who would this help?
    options:
    - Everyone — change the shared skill
    - Mainly my institution — consider a variant
    - Not sure
- type: textarea
  id: what
  attributes:
    label: What should change, and why?
  validations:
    required: true
- type: textarea
  id: wording
  attributes:
    label: Proposed wording (optional)
    render: markdown
- type: input
  id: evidence
  attributes:
    label: Source or experience behind it (optional)
    placeholder: a study, a standard, or 'used it in 3 courses and saw…'
