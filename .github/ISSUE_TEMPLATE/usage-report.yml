name: Usage report
description: Tell us how a skill worked for a real teaching task
title: '[usage] <skill> — <tool>'
labels:
- usage-report
body:
- type: markdown
  attributes:
    value: Thank you! Please don't include patient data, learner names or grades, or unpublished material.
- type: input
  id: contributor_name
  attributes:
    label: Your name
- type: input
  id: institution
  attributes:
    label: Institution
    description: Every contribution is recorded with its institution, so the community page can show where the library's knowledge comes from.
  validations:
    required: true
- type: input
  id: country
  attributes:
    label: Country
  validations:
    required: true
- type: input
  id: role
  attributes:
    label: Your role
    placeholder: e.g. course leader, MSTP director, graduate program administrator
- type: checkboxes
  id: credit
  attributes:
    label: Credit
    options:
    - label: Credit me by name on the community page (otherwise only the institution is shown)
- type: dropdown
  id: skill
  attributes:
    label: Skill
    options:
    - Clinical Integration Task Generator (clinical-integration-notebooks)
    - Committee Meeting Planner (committee-meeting-planner)
    - Curriculum Map Builder (curriculum-map-builder)
    - Exam Question Writer (exam-question-writer)
    - Journal Club Planner (journal-club-planner)
    - Leadership Communication Meeting Organizer (leadership-communication-meeting-organizer)
    - Learning Objectives Designer (learning-objectives-designer)
    - Lesson & Notebook Format Checker (lesson-format-checker)
    - MD-PhD Calendar Builder (mdphd-calendar-builder)
    - MSTP T32 Preparer (mstp-t32-planner)
    - Mentor Compact Creator (mentor-compact-creator)
    - PBL / RBL Session Builder (pbl-rbl-session-builder)
    - Plain Language Writer (plain-language-writer)
    - Reading Material Generator (reading-material-generator)
    - Syllabus Builder (syllabus-builder)
    - Thesis Lab Navigator (thesis-lab-navigator)
    - Another skill, or not sure
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Skill version (from card.yaml)
- type: dropdown
  id: tool
  attributes:
    label: AI tool
    options:
    - Claude
    - ChatGPT
    - Gemini
    - Microsoft 365 Copilot
    - Another assistant (paste-in)
  validations:
    required: true
- type: input
  id: plan
  attributes:
    label: Plan or version (optional)
    placeholder: e.g. ChatGPT Edu, Claude Pro, Gemini Enterprise
- type: dropdown
  id: context
  attributes:
    label: How did you use it?
    description: 'Real teaching moves a skill up the maturity ladder: at the institution that wrote it, to Tested at origin; at another institution, to Tested elsewhere.'
    options:
    - Real teaching, with learners
    - Preparing teaching, before learners saw it
    - Trying it out
  validations:
    required: true
- type: textarea
  id: task
  attributes:
    label: Task — what you asked it to do
  validations:
    required: true
- type: dropdown
  id: outcome
  attributes:
    label: Outcome
    options:
    - Used as-is
    - Used after edits
    - Not used
  validations:
    required: true
- type: input
  id: time
  attributes:
    label: Roughly how long until a usable result?
- type: dropdown
  id: help
  attributes:
    label: Help needed
    options:
    - None
    - Documentation only
    - Help from a colleague
    - Help from the skill's author
- type: textarea
  id: worked
  attributes:
    label: What worked
- type: textarea
  id: didnt
  attributes:
    label: What didn't work (be specific)
- type: textarea
  id: changed
  attributes:
    label: What you changed (in the output or the skill)
- type: dropdown
  id: again
  attributes:
    label: Would you use it again?
    options:
    - 'Yes'
    - Maybe
    - 'No'
- type: checkboxes
  id: listing
  attributes:
    label: Listing
    options:
    - label: You may list my institution in the skill's used_at
